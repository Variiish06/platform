# Every app behind the proxy. One entry here does everything:
#   - routes  http://<id>.exp.lab  to the app   (Caddy asks Portal where to send it)
#   - puts Portal's login in front of it        (unless auth: false)
#   - adds a tile to the dashboard
#   - health-checks it every 30 seconds
#
# Portal re-reads this file within 30 seconds of a change. No restart needed.
# If the file has a mistake, the previous version stays active and the
# dashboard shows the error.
#
# Fields:
#   id           hostname label (lowercase letters, digits, dashes)
#   name         title on the tile
#   description  one short line under the title (optional)
#   icon         timer, check, git, bot, globe, server, database, chart, book,
#                home, code, film, music, cloud, wallet, box (optional)
#   upstream     host:port where the app really listens. Portal and Caddy run
#                on the host network, so 127.0.0.1 is the server itself.
#   auth         true (default): Portal login required. false: no Portal login.
#   health       path to probe (default "/"). Any answer below HTTP 500 is "up".
#   containers   Docker container names that make up the app (optional), e.g.
#                [groqbots-orchestrator-1]. Adds a Stop/Start button to the app's
#                row that acts on exactly these containers. Stopping also
#                silences their alerts in Alertmanager (30 days); starting from
#                Portal removes the silence. Names must match `docker ps -a`
#                exactly; unknown names are shown as an error and nothing is sent
#                to Docker. Platform containers (portal, caddy, coredns, the
#                socket proxies) are refused. Leave it out for apps that do not
#                run in Docker (Ritual) or that you never want stopped from here.

apps:
  - id: focal
    name: Focal
    description: Pomodoro timer
    icon: timer
    upstream: 127.0.0.1:8787
    containers: [focal]

  - id: ritual
    name: Ritual
    description: Habits and to-dos
    icon: check
    upstream: 127.0.0.1:8090

  - id: bot
    name: Bots
    description: Groq bot team
    icon: bot
    upstream: 127.0.0.1:8080
    # Only the long-running orchestrator. Not groqbots-bot-image-1 (a
    # one-shot image build) or groqbots-testsite-1 (test helper).
    containers: [groqbots-orchestrator-1]

  - id: git
    name: Gitea
    description: Git hosting
    icon: git
    upstream: 127.0.0.1:3000
    containers: [gitea-gitea-1]
    # Gitea has its own login, and git clients cannot do cookie logins.
    auth: false
    health: /api/healthz

  - id: ntfy
    name: ntfy
    description: Notifications (pub/sub)
    icon: cloud
    upstream: 127.0.0.1:2586
    # Not behind Portal login: the ntfy iPhone app and services publishing
    # with tokens cannot do a cookie login. ntfy enforces its own auth
    # (deny-all by default, users + tokens; see ntfy/server.yml, NOTIFY.md).
    auth: false
    health: /v1/health

  # Phase B monitoring UIs. Both behind Portal login (default auth).
  - id: vm
    name: VictoriaMetrics
    description: Metrics DB; query UI at /vmui, alert rules at /vmalert
    icon: chart
    upstream: 127.0.0.1:8428
    health: /health

  - id: alerts
    name: Alertmanager
    description: Active alerts and silences
    icon: server
    upstream: 127.0.0.1:9093
    health: /-/healthy
