# Platform stack: private DNS, reverse proxy, Portal (login + dashboard)
# and a locked-down proxy in front of the Docker socket.
name: platform

# More services, each in its own file, merged into this same project
# ("platform"): they share .env and appear in "docker compose ps".
include:
  - compose.notify.yml          # Phase A: ntfy notification hub
  - compose.monitoring.yml      # Phase B: metrics, alerts
  - compose.backup.yml          # Phase C: restic backups

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  coredns:
    <<: *defaults
    image: coredns/coredns:1.12.1
    command: ["-conf", "/etc/coredns/Corefile"]
    network_mode: host            # binds only to TS_IP:53 (see Corefile)
    environment:
      DOMAIN: ${DOMAIN}
      TS_IP: ${TS_IP}
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 32m

  caddy:
    <<: *defaults
    image: caddy:2-alpine
    entrypoint: ["/entrypoint.sh"]
    network_mode: host            # binds only to TS_IP and the LAN IP (see entrypoint.sh)
    environment:
      DOMAIN: ${DOMAIN}
      TS_IP: ${TS_IP}
      LAN_IFACE: ${LAN_IFACE}
      GOMEMLIMIT: 48MiB
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 64m

  portal:
    <<: *defaults
    build: ./portal
    image: platform-portal:latest
    # Host network, for two reasons: Portal health-checks apps on
    # 127.0.0.1, and /proc/net/wireless (WiFi signal) is only the host's
    # when the network namespace is shared. It listens on loopback only.
    network_mode: host
    user: "${PUID}:${PGID}"
    environment:
      PORTAL_LISTEN: 127.0.0.1:7080
      PORTAL_DOMAIN: ${DOMAIN}
      PORTAL_USER: ${PORTAL_USER:-admin}
      PORTAL_COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PORTAL_DATA: /data
      PORTAL_DOCKER_SOCK: /run/docker-proxy/docker.sock
      TZ: ${TZ:-UTC}
      GOMEMLIMIT: 64MiB
      # Notifications panel: Portal polls ntfy with a READ-ONLY token.
      # Empty or unreachable is fine: the panel says "ntfy not reachable".
      PORTAL_NTFY_URL: http://127.0.0.1:2586
      PORTAL_NTFY_TOKEN: ${NTFY_TOKEN_PORTAL:-}
      # Graphs page + uptime bars: Portal queries VictoriaMetrics (Phase B).
      PORTAL_VM_URL: http://127.0.0.1:8428
      # Memory panel ("what is taking the RAM"): the host's processes,
      # read from the host's /proc mounted read-only below. Unset = off.
      PORTAL_HOST_PROC: /host/proc
      # Optional: Claude Code's per-process session files, for each
      # session's working directory and idle/busy state (/proc/<pid>/cwd
      # is blocked by Docker's AppArmor profile). Only <pid>.json is read.
      PORTAL_CLAUDE_SESSIONS: /host/claude-sessions
    volumes:
      # portal.db + apps.yaml (back this up), backup/ (reads status.json,
      # writes requests/). The rest of ./data belongs to other services and
      # is hidden below.
      - ./data:/data
      # Only Portal's own proxy socket, NOT the real Docker socket, and not
      # the rest of ./run (node_exporter's textfile directory...).
      - ./run/portal:/run/docker-proxy
      # The host's /proc, read-only, for the Memory panel. This lets Portal
      # see every host process's name, command line (shown redacted, see
      # internal/procmem) and memory, but not their environment, files or
      # memory contents: those need ptrace access, which Docker's AppArmor
      # profile and the missing capabilities refuse. No pid: host needed.
      - /proc:/host/proc:ro
      - ~/.claude/sessions:/host/claude-sessions:ro
    # Other services' state inside ./data is masked with empty, read-only,
    # mode-000 tmpfs mounts: Portal cannot read ntfy's auth.db (admin hash,
    # tokens), VictoriaMetrics' or Alertmanager's files, even if Portal is
    # compromised. (Docker mounts these AFTER ./data: deeper paths go last.)
    tmpfs:
      - /data/ntfy:ro,size=4k,mode=000
      - /data/vm:ro,size=4k,mode=000
      - /data/alertmanager:ro,size=4k,mode=000
    depends_on: [docker-proxy]
    healthcheck:
      test: ["CMD", "/portal", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m

  # Portal's door to /var/run/docker.sock. It re-exports it as
  # ./run/portal/docker.sock (a directory of its own, so Portal mounts
  # nothing else from ./run) and forwards nothing but the requests matched
  # below: list and stats (GET) and restart (POST). Inspect, create, exec,
  # delete, images, volumes... are all refused with 403.
  # (The backup container has its own proxy: compose.backup.yml.)
  docker-proxy:
    <<: *defaults
    # Pinned to the exact release AND image digest: this process holds the
    # real Docker socket, so it only changes when we change it on purpose.
    image: wollomatic/socket-proxy:1.13.2@sha256:ff95d6ff6c27853005ef85eb8f4ab5923dc3d2f1e055f98fb6aeeaceec3fe848
    command:
      - -loglevel=WARN
      - -proxysocketendpoint=/run/docker-proxy/docker.sock
      - -allowGET=/v1\.[0-9]+/containers/(json|[a-zA-Z0-9_.-]+/stats)
      - -allowPOST=/v1\.[0-9]+/containers/[a-zA-Z0-9_.-]+/restart
    network_mode: none                  # no network at all: reachable only via the socket file
    user: "${PUID}:${DOCKER_GID}"       # docker group, so it may open the real socket
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Must exist and be owned by uid 1000 BEFORE the first start (it is in
      # git as run/portal/.gitkeep); a directory Docker creates would be root's.
      - ./run/portal:/run/docker-proxy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 24m
