# Platform stack: private DNS + reverse proxy (+ Portal, added in later phases).
name: platform

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  coredns:
    <<: *defaults
    image: coredns/coredns:1.12.1
    command: ["-conf", "/etc/coredns/Corefile"]
    network_mode: host            # binds only to TS_IP:53 (see Corefile)
    environment:
      DOMAIN: ${DOMAIN}
      TS_IP: ${TS_IP}
    volumes:
      - ./coredns/Corefile:/etc/coredns/Corefile:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 32m

  caddy:
    <<: *defaults
    image: caddy:2-alpine
    entrypoint: ["/entrypoint.sh"]
    network_mode: host            # binds only to TS_IP and the LAN IP (see entrypoint.sh)
    environment:
      DOMAIN: ${DOMAIN}
      TS_IP: ${TS_IP}
      LAN_IFACE: ${LAN_IFACE}
      GOMEMLIMIT: 48MiB
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/entrypoint.sh:/entrypoint.sh:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 64m
